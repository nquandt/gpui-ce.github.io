base_url = "https://gpui-ce.github.io"
title = "GPUI Community Edition"
description = "A fast, productive UI framework for Rust"
default_language = "en"

compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = false

[markdown]
smart_punctuation = true

[markdown.highlighting]
error_on_missing_language = false

style = "class"
theme = "github-dark"

[extra]
github_repo = "https://github.com/gpui-ce/gpui-ce"
crate_url = "https://crates.io/crates/gpui-ce"
